# hypridle configuration
# Ersetzt xidlehook. Doku: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock       # verhindert mehrfaches Locken
    before_sleep_cmd = loginctl lock-session     # vor Suspend sperren
    after_sleep_cmd = hyprctl dispatch dpms on    # Displays nach Resume aufwecken
}

# Nach 10 min: Session sperren (entspricht altem xidlehook --timer 600 'lock').
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Weitere 5 min (900 s gesamt) ohne Aktivitaet: suspenden, aber nur wenn gerade
# kein Media-Player (MPRIS) abspielt. suspend-if-idle kapselt den
# playerctl-Check (entspricht altem xidlehook --not-when-audio --timer 300
# 'systemctl suspend').
listener {
    timeout = 900
    on-timeout = suspend-if-idle
}
