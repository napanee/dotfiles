# Hyprland configuration
# Migriert von qtile (X11) auf Hyprland (Wayland). Siehe MIGRATION.md.
# Doku: https://wiki.hypr.land/Configuring/

################
### MONITORS ###
################

# Monitor-Layouts werden dynamisch von kanshi (EDID-/Serial-Match) gesetzt,
# siehe ~/.config/kanshi/config. Hier nur ein sinnvoller Fallback, damit auch
# ohne kanshi-Profil ein Bild erscheint.
monitor = , preferred, auto, 1

###################
### ENVIRONMENT ###
###################

env = XCURSOR_SIZE,16
env = QT_AUTO_SCREEN_SCALE_FACTOR,0
env = QT_SCALE_FACTOR,1
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORM,wayland
env = SDL_VIDEODRIVER,wayland
env = _JAVA_AWT_WM_NONREPARENTING,1

#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant = altgr-intl
    kb_options = ctrl:swap_lalt_lctl
    numlock_by_default = true
    touchpad {
        tap-to-click = true
    }
}

#################
### AUTOSTART ###
#################

exec-once = hypridle
exec-once = kanshi
exec-once = dunst

###################
### KEYBINDINGS ###
###################

$mod = SUPER

# Apps
bind = SUPER SHIFT, Return, exec, wezterm
bind = SUPER, Space, exec, rofi -show drun
bind = SUPER SHIFT, W, exec, rofi -show window
bind = SUPER SHIFT, E, exec, rofi -show emoji
bind = SUPER SHIFT, Q, exec, powermenu
bind = SUPER SHIFT, B, exec, firefox

# Session / Lock
bind = SUPER SHIFT, L, exec, loginctl lock-session

# Window management
bind = SUPER SHIFT, X, killactive
bind = SUPER, F, fullscreen, 0
bind = SUPER SHIFT, F, togglefloating
bind = SUPER, Tab, cyclenext

# Reload / Exit
bind = SUPER CTRL, R, exec, hyprctl reload
bind = SUPER CTRL, Q, exit

# Monitor-Fokus (ersetzt qtile to_screen(2/0/1) fuer q/w/e)
# TODO: Monitor-Namen am lebenden System pruefen (`hyprctl monitors`); unter
# MST/Daisy-Chain koennen sich die Output-Namen aendern. Ggf. auf Richtungen
# (l/r/u/d) oder konkrete Namen anpassen.
bind = SUPER, Q, focusmonitor, DP-2
bind = SUPER, W, focusmonitor, DP-1
bind = SUPER, E, focusmonitor, eDP-1

# Screenshots (grim/slurp/wl-copy statt slop/maim/copyq)
bind = SUPER CTRL SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy -t image/png
bind = SUPER SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy -t image/png
bind = SUPER ALT SHIFT, S, exec, grim -g "$(slurp)" ~/Documents/screenshot_$(date +%Y%m%d_%H%M%S).png

# Volume (bindl = auch im gesperrten/inaktiven Zustand)
bindl = , XF86AudioMute, exec, changevolume mute
bindl = , XF86AudioLowerVolume, exec, changevolume down
bindl = , XF86AudioRaiseVolume, exec, changevolume up

# Backlight
bindl = , XF86MonBrightnessDown, exec, changebacklight down
bindl = , XF86MonBrightnessUp, exec, changebacklight up
