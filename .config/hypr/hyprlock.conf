$font = JetBrains Mono

general {
    no_fade_in = true
    no_fade_out = true
    disable_loading_bar = false
    hide_cursor = true
    immediate_render = true
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgb(0, 0, 0)
    blur_passes = 1
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.8916
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = <span>$USER - Password:</span>
    color = rgba(255, 255, 255, 0.90)
    halign = center
    valign = center
    position = 0, 50
    font_family = $font
    font_size = 10
}

input-field {
    monitor =
    font_family = $font
    dots_text_format = *
    outline_thickness = -1
    dots_size = 0.1
    inner_color =rgba(0, 0, 0, 0)
    font_color = rgba(255, 255, 255, 0.90)
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    halign = center
    valign = center
}

label {
    monitor =
    text = <b>______________________________</b>
    color = rgba(255, 255, 255, 0.90)
    position = 0, 0
    halign = center
    valign = center
    zindex = 10
    position = 0, -5
    font_family = $font
    font_size = 10
}
